name: teploservice_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.2.0+8

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.1
  web_socket_channel: ^3.0.3
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  json_annotation: ^4.11.0
  flutter_secure_storage: ^10.0.0
  flutter_map: ^7.0.2
  flutter_map_cache: ^1.5.2
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_hive_store: ^4.0.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  uuid: ^4.5.1
  freezed_annotation: ^3.1.0
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.5
  path: ^1.9.1
  connectivity_plus: ^6.1.0
  intl: ^0.20.2
  flutter_slidable: ^4.0.3
  image_picker: ^1.1.2
  window_manager: ^0.5.1
  windows_notification: ^1.1.2
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.0
  device_info_plus: ^11.3.3

  # Чек об оплате: диалог с QR и PDF «как в кассе». Версии совпадают с
  # teploservice_flutter — чек собирается тем же кодом, и расхождение
  # версий pdf/qr дало бы два разных документа.
  pdf: ^3.12.0
  qr_flutter: ^4.1.0
  share_plus: ^12.0.2
  # Нужен FileExportHelper: на десктопе чек сохраняется диалогом
  # «Сохранить как», на телефоне уходит в share sheet.
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  riverpod_generator: ^4.0.3
  json_serializable: ^6.13.0
  riverpod_lint: ^3.1.3
  freezed: ^3.2.5
  drift_dev: ^2.31.0
  msix: ^3.16.1

flutter:
  uses-material-design: true
  assets:
    # Шрифт для PDF-чека: пакет pdf не умеет кириллицу встроенными
    # шрифтами — без этого файла в чеке вместо текста пустые квадраты.
    - assets/fonts/Roboto-Regular.ttf

msix_config:
  display_name: "TeploserviseMap"
  publisher_display_name: "ShAglarov"
  identity_name: "ShAglarov.TeploserviseMap"
  publisher: "CN=7256F9B6-2A6A-4C62-AEFE-DDE0611409E3"
  version: "1.2.0.0"
  capabilities: "internetClient, pushNotification" # pushNotification is critical
  store: true
  install_certificate: false
